<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #background {
    display:block; position:fixed; inset:0;
    width:100%; height:100%; object-fit:cover;
    object-position:center center; border:0;
  }
</style>
</head>
<body>
<img id="background" alt="" draggable="false" src="https://raw.githubusercontent.com/idelit81-ship-it/load-menu-horror/main/image%20%2855%29.webp">
<audio id="music" preload="auto" autoplay src="https://raw.githubusercontent.com/idelit81-ship-it/ohigjk/main/1001%20%282%29%20%28online-audio-converter.com%29%20%281%29.mp3"></audio>
<script>
(function () {
  'use strict';
  var img = document.getElementById('background');
  // Garry's Mod's older embedded browser may not support WebP decoding.
  // Use a JPG-transcoding proxy if the original WebP fails.
  var imageSources = [
    'https://raw.githubusercontent.com/idelit81-ship-it/load-menu-horror/main/image%20%2855%29.webp',
    'https://wsrv.nl/?url=raw.githubusercontent.com%2Fidelit81-ship-it%2Fload-menu-horror%2Fmain%2Fimage%2520%252855%2529.webp&output=jpg',
    'https://github.com/idelit81-ship-it/load-menu-horror/raw/refs/heads/main/image%20%2855%29.webp'
  ];
  var current = 0;
  img.onerror = function () {
    current += 1;
    if (current < imageSources.length) img.src = imageSources[current];
  };

  var audio = document.getElementById('music');
  audio.loop = false;
  audio.volume = 0.85;
  var ended = false;
  audio.addEventListener('ended', function () { ended = true; });
  function startIfNotFinished() {
    if (ended || !audio.paused) return;
    var promise = audio.play();
    if (promise && typeof promise.catch === 'function') promise.catch(function () {});
  }
  // Autoplay can be denied by the embedded browser. Retry only on the first
  // user gesture, without repeating music after it has ended.
  startIfNotFinished();
  document.addEventListener('click', startIfNotFinished);
  document.addEventListener('keydown', startIfNotFinished);
})();
</script>
</body>
</html>
